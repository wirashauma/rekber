name: rekber
description: REKBER - Automated Escrow Platform for secure buyer-seller transactions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.1

  # State Management (BLoC)
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.5.0

  # Routing
  go_router: ^14.0.0

  # Functional Programming
  dartz: ^0.10.1

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  lottie: ^3.1.2

  # Image handling
  image_picker: ^1.1.2
  image_cropper: ^12.2.1

  # Chat & Real-time
  timeago: ^3.7.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^7.2.2
  flutter_local_notifications: ^21.0.0

  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4

  # Charts (for Seller Dashboard)
  fl_chart: ^1.2.0

  # QR Code (for QRIS payments)
  qr_flutter: ^4.1.0

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  firebase_messaging: ^16.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  bloc_test: ^9.1.5
  mocktail: ^1.0.1
  build_runner: ^2.4.7
  injectable_generator: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts: []

