name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # =============================================================================
  # Backend Lint, Validate, Migrate & Test
  # =============================================================================
  backend:
    name: Backend CI (Lint, Migrate, Test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: rekber_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Run Prisma Migrate Deploy
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/rekber_test?schema=public
        run: npx prisma migrate deploy

      - name: Run Unit & Integration Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/rekber_test?schema=public
          JWT_SECRET: test_jwt_secret_must_be_at_least_32_characters_long_ci
          DATA_ENCRYPTION_KEY: test_data_encryption_key_at_least_32_bytes_ci
          CI: true
        run: npm test

  # =============================================================================
  # Mobile Flutter Analyze & Test
  # =============================================================================
  mobile:
    name: Mobile CI (Analyze, Test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test test/core/ test/features/ test/config/
