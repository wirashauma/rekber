version: '3.8'

services:
  # =============================================================================
  # PostgreSQL Database Service
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: rekber-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rekber
      POSTGRES_PASSWORD: rekber_staging_password
      POSTGRES_DB: rekber_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rekber -d rekber_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =============================================================================
  # MinIO S3-Compatible Object Storage Service
  # =============================================================================
  minio:
    image: minio/minio:latest
    container_name: rekber-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =============================================================================
  # REKBER Backend API Service
  # =============================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rekber-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: staging
      PORT: 5000
      DATABASE_URL: postgresql://rekber:rekber_staging_password@postgres:5432/rekber_db?schema=public
      JWT_SECRET: rekber_staging_jwt_secret_key_at_least_32_chars_long
      DATA_ENCRYPTION_KEY: rekber_staging_data_encryption_key_32_bytes_long
      PAYMENT_PROVIDER: fake
      STORAGE_PROVIDER: local
      RUN_JOBS_IN_API: "false"
      METRICS_TOKEN: rekber-staging-metrics-token-12345
    depends_on:
      postgres:
        condition: service_healthy

  # =============================================================================
  # REKBER Background Worker Service
  # =============================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rekber-worker
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgresql://rekber:rekber_staging_password@postgres:5432/rekber_db?schema=public
      JWT_SECRET: rekber_staging_jwt_secret_key_at_least_32_chars_long
      DATA_ENCRYPTION_KEY: rekber_staging_data_encryption_key_32_bytes_long
      PAYMENT_PROVIDER: fake
      STORAGE_PROVIDER: local
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
